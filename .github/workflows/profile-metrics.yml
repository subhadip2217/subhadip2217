name: Update profile metrics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-metrics.yml
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # Repository language breakdown
          plugin_languages: yes
          plugin_languages_limit: 8

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Keep optional, currently broken upstream plugins disabled:
          # plugin_activity currently errors on some GitHub event payloads.
          # plugin_achievements currently calls the retired Projects (classic) API.
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 120
